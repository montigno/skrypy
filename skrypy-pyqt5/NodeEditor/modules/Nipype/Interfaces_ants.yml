ants_AI:
  args: ''
  convergence: (10, 1e-06, 10)
  dimension: 3
  environ: {}
  fixed_image_mask: "path"
  moving_image_mask: "path" # Optional requires: [fixed_image_mask]
  num_threads: 1
  output_transform: "path"
  principal_axes: True # Optional Mutually exclusive with: [blobs]
  search_factor: (20, 0.12)
  search_grid: (0.0, (0.0, 0.0, 0.0))
  transform: ('Affine', 0.1)
  verbose: True
ants_ANTS:
  affine_gradient_descent_option: [0.0]
  args: ''
  delta_time: 0.0 # Optional requires: [number_of_time_steps]
  dimension: 3
  environ: {}
  gradient_step_length: 0.0 # Optional requires: [transformation_model]
  mi_option: [0]
  num_threads: 1
  number_of_affine_iterations: [0]
  number_of_iterations: [0]
  number_of_time_steps: 0 # Optional requires: [gradient_step_length]
  regularization: "enumerate(('Gauss','DMFFD'))"
  regularization_deformation_field_sigma: 0.0 # Optional requires: [regularization]
  regularization_gradient_field_sigma: 0.0 # Optional requires: [regularization]
  smoothing_sigmas: [0]
  subsampling_factors: [0]
  symmetry_type: 0.0 # Optional requires: [delta_time]
  use_histogram_matching: True
ants_AffineInitializer:
  args: ''
  dimension: 3
  environ: {}
  local_search: 10
  num_threads: 1
  out_file: "path"
  principal_axes: True
  radian_fraction: 0.1
  search_factor: 15.0
ants_AntsJointFusion:
  alpha: 0.1
  args: ''
  beta: 2.0
  constrain_nonnegative: True
  dimension: 3
  environ: {}
  exclusion_image: ["path"]
  exclusion_image_label: [''] # Optional requires: [exclusion_image]
  mask_image: "path"
  num_threads: 1
  out_atlas_voting_weight_name_format: "path" # Optional requires: [out_label_fusion, out_intensity_fusion_name_format, out_label_post_prob_name_format]
