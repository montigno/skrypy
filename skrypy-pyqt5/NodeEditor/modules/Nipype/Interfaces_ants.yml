  output_transform_prefix: 'transform'
  output_warped_image: "path"
  radius_bins_item_trait: 5
  radius_bins_stage_trait: [0]
  radius_or_number_of_bins: [0] # Optional requires: [metric_weight]
  random_seed: 0
  restore_state: "path"
  restrict_deformation: [[0.0]]
  sampling_percentage: [0.0] # Optional requires: [sampling_strategy]
  sampling_percentage_item_trait: 0.0
  sampling_percentage_stage_trait: [0.0]
  sampling_strategy: "enumerate(('None','Regular','Random'))" # Optional requires: [metric_weight]
  sampling_strategy_item_trait: "enumerate(('None','Regular','Random'))"
  sampling_strategy_stage_trait: "enumerate(('None','Regular','Random'))"
  save_state: "path"
  sigma_units: "enumerate(('mm','vox'))" # Optional requires: [smoothing_sigmas]
  shrink_factors: [[2,1], [3,2,1]]
  transform_parameters: [(2.0,), (0.25, 26, 0, 3)]
  use_estimate_learning_rate_once: [True]
  use_histogram_matching: [True]
  verbose: True
  winsorize_lower_quantile: 0.0
