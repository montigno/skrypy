  out_label_fusion: "path"
  out_label_post_prob_name_format: antsJointFusionPosterior_%d.nii.gz # Optional requires: [out_label_fusion, out_intensity_fusion_name_format]
  patch_metric: "enumerate(('PC','MSQ'))"
  patch_radius: [2, 2, 2]
  retain_atlas_voting_images: True
  retain_label_posterior_images: True # Optional requires: [atlas_segmentation_image]
  search_radius: [3]
  verbose: True
